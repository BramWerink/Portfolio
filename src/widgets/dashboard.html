<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="widget-base.css">
<style>
.dashboard-wrapper {
        background: white;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
        width: 90%;
        max-width: 480px;
        border-radius: 2rem;
    }

    .dashboard-wrapper p {
        margin: 0;
    }

    .dashboard-wrapper svg {
        min-width: 1rem!important;
        min-height: 1rem!important;
        color: black;
    }

    .dashboard-wrapper .progress-bar {
        width: 100%;
        background: white;
        height: 2rem;
        border-radius: 2rem;
        overflow: hidden;
        display: flex;
        flex-direction: row;
        justify-content: start;
        flex-wrap: nowrap;
        position: relative;
    }

    .dashboard-wrapper .progress-bar .bar {
        height: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 1rem;
        transition: width 1s ease-in-out;
    }

    .dashboard-wrapper .progress-bar .bar.primary {
        background: #FE5F48;
        position: relative;
    }

    .dashboard-wrapper .progress-bar .bar .percentage {
        margin: 0;
        color: black;
    }

    .dashboard-wrapper .progress-bar .bar.secondary {
        background: #FE5F48;
        opacity: .5;
    }

    .dashboard-wrapper .progress-bar .bar.tertiary {
        flex: 1;
        background: repeating-linear-gradient(
            -45deg,
            #d4d4d4,
            #d4d4d4 5px,
            #ffffff 5px,
            #ffffff 10px
        );
        position: relative;
    }

    .dashboard-wrapper .columns {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
    }

    .dashboard-wrapper .column {
        flex: 1;
        background: #F2F2F2;
        border-radius: 1rem;
        padding: 1rem;
    }

    .dashboard-wrapper .column .top {
        display: flex;
        flex-direction: row;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
    }

    .dashboard-wrapper .column .top .icon {
        width: 2rem;
        height: 2rem;
        background: white;
        border-radius: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .dashboard-wrapper .column .counter {
        padding-top: 1rem;
    }

    .dashboard-wrapper .column .counter span.done {
        min-width: 2ch;
        display: inline-block;
    }

    .dashboard-wrapper .column .counter span.total {
        opacity: .5;
    }
</style>
</head>
<body>

<div class="dashboard-wrapper">
    <div class="progress-bar">
        <div class="bar primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <p class="percentage"></p>
        </div>
        <div class="bar secondary">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            <p class="percentage"></p>
        </div>
        <div class="bar tertiary"></div>
    </div>

    <div class="columns">
        <div class="column">
            <div class="top">
                <div class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                </div>
                <div class="categorie">Ruwbouw</div>
            </div>
            <p class="counter"><span id="done1" class="done">19</span>/<span id="total1" class="total">68</span></p>
        </div>

        <div class="column">
            <div class="top">
                <div class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                </div>
                <div class="categorie">Elektra</div>
            </div>
            <p class="counter"><span id="done2" class="done">16</span>/<span id="total2" class="total">43</span></p>
        </div>
    </div>
</div>

<script>
function initDashboard() {
    function animateProgress(doneId, totalId, barClass, duration = 1000) {
        const total = parseInt(document.getElementById(totalId).innerText);
        const done = parseInt(document.getElementById(doneId).innerText);
        const percentage = Math.round((done / total) * 100);

        const bar = document.querySelector(`.${barClass}`);
        const percentageText = bar.querySelector('.percentage');

        bar.style.width = '0%';
        percentageText.innerText = '0%';

        setTimeout(() => {
            bar.style.transition = `width ${duration}ms ease-in-out`;
            bar.style.width = `${percentage}%`;
            percentageText.innerText = `${percentage}%`;
        }, 100);
    }

    animateProgress('done1', 'total1', 'primary');
    animateProgress('done2', 'total2', 'secondary');
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initDashboard);
} else {
    initDashboard();
}
</script>
</body>
</html>
